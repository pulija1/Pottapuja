# Publishes the public/ folder to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
# On Pages there is no server, so AI recipes fall back to the built-in recipe book.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The recipe book lives in recipes/ at the top of the repository; the app reads it from recipes/ next to index.html.
      - run: cp -r recipes public/recipes
      # Give every file URL this deploy's version, so phones never mix cached old and new files.
      - run: node scripts/stamp-version.mjs public "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
