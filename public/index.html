<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17120e" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://api.anthropic.com; frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://apis.google.com; base-uri 'none'">
  <title>Family Meal Planner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="app.js">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🍛</span>
      <div>
        <h1>Family Meal Planner</h1>
        <p class="sub" id="today-label" data-testid="today-label"></p>
      </div>
    </div>
    <div class="top-right">
      <button class="ai-chip" id="ai-chip" data-testid="ai-status" type="button" title="Recipe AI status">AI: checking…</button>
      <button class="cloud-btn" id="cloud" data-testid="cloud-status" type="button" hidden>☁ Sync</button>
      <button class="avatar" id="profile" data-testid="profile" type="button" aria-label="Profile and family sync">👤</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="calendar" data-testid="tab-calendar" aria-selected="true"><span aria-hidden="true">📅</span>Calendar</button>
    <button role="tab" data-tab="recipes" data-testid="tab-recipes"><span aria-hidden="true">🥣</span>Recipes</button>
    <button role="tab" data-tab="shopping" data-testid="tab-shopping"><span aria-hidden="true">🛒</span>Shopping</button>
    <button role="tab" data-tab="frozen" data-testid="tab-frozen"><span aria-hidden="true">🧊</span>Frozen</button>
    <button role="tab" data-tab="reminders" data-testid="tab-reminders"><span aria-hidden="true">⏰</span>Reminders</button>
  </nav>

  <main id="main">
    <section id="view-calendar" class="view" data-testid="view-calendar"></section>
    <section id="view-recipes" class="view" hidden data-testid="view-recipes"></section>
    <section id="view-shopping" class="view" hidden data-testid="view-shopping"></section>
    <section id="view-frozen" class="view" hidden data-testid="view-frozen"></section>
    <section id="view-reminders" class="view" hidden data-testid="view-reminders"></section>
  </main>

  <section id="login" class="login" hidden aria-label="Sign in" data-testid="login"></section>
  <div id="save-warning" class="save-warning" role="alert" hidden data-testid="save-warning">⚠️ Changes aren't being saved on this device (storage is full or blocked). Download a backup so nothing is lost.</div>
  <div id="toast" class="toast" role="status" aria-live="polite" data-testid="toast"></div>
  <script src="boot.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
